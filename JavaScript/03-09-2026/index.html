<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>Slider + Popup</title>
  </head>
  <body>
    <div class="container-div">
      <button class="btn" id="slider-btn">Open Slider</button>
      <button class="btn" id="popup-btn">Open Popup</button>
    </div>
    <div id="slider" class="slider-wrapper">
      <div class="slider-top">
        <h2 class="heading">Add FAQ</h2>
        <button id="close-button" class="close-slider">X</btn>
      </div>
    </div>

    <div id="popup" class="popup-outer-container">
        <div class="popup-inner-container">
            <h4 class="p-heading">Popup Heading</h4>
            <p class="p-desc">Popup Description</p>
            <div class="p-bottom">
                <button class="p-btn">Close</button>
                <button  class="p-btn">Confirm</button>
            </div>
        </div>

    </div>

    <script src="./index.js"></script>
  </body>
</html>
