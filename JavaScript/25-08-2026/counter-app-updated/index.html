<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>counter-app</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="inner-container">
        <h1 class="heading">COUNTER APP</h1>
        <div class="count"></div>
        <div class="btn-container">
          <button class="btn inc" onclick="performIncrement()">
            Increment
          </button>
          <button class="btn dec" onclick="performDecrement()">
            Decrement
          </button>
          <button class="btn rst" onclick="performReset()">Reset</button>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
