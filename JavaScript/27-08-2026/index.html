<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Document</title>
  </head>
  <body>
    <button id="btn">Button</button>

    <div id="box">Box</div>

    <div>
      <input type="text" placeholder="Name input" id="name-input" />
      <!-- <input type="email" placeholder="Email input" id="email-input" /> -->
    </div>
    <div>
      <textarea id="textbox-input"></textarea>
    </div>

    <div>
      Are you married?
      <label for="yes-option">
        <input
          type="radio"
          name="yes-no-input"
          id="yes-option"
          class="radio-input"
          value="Yes"
        />
        Yes
      </label>
      <label for="no-option">
        <input
          type="radio"
          name="yes-no-input"
          id="no-option"
          class="radio-input"
          value="No"
        />
        No
      </label>
    </div>
    <div>
      <label for="dog">
        <input
          type="checkbox"
          name="pets"
          class="checkbox-input"
          id="dog"
          value="Dog"
        />
        Dog
      </label>
      <label for="cat">
        <input
          type="checkbox"
          name="pets"
          class="checkbox-input"
          id="cat"
          value="Cat"
        />
        Cat
      </label>
      <label for="turtle">
        <input
          type="checkbox"
          name="pets"
          class="checkbox-input"
          id="turtle"
          value="Turtle"
        />
        Turtle
      </label>
    </div>

    <div>
      <select id="select-input">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <div id="btn-container">
      <button id="btn-element">Button</button>
    </div>
    <form id="signin-form">
      <label for=""
        >Email: <input type="email" id="email-input" placeholder="Enter Name" />
      </label>
      <label for=""
        >Password:
        <input
          type="password"
          id="password-input"
          placeholder="Enter Password"
        />
      </label>
      <button type="submit">Submit</button>
    </form>

    <script src="./index.js"></script>
  </body>
</html>
